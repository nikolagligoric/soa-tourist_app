version: '3.9'

services:
  stakeholders:
    build:
      context: ./Stakeholders/stakeholders-be
      dockerfile: Stakeholders.API/Dockerfile
      target: final
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: https://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/stakeholders.pfx
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=stakeholders_db;Username=postgres;Password=postgres"
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: postgres
      DATABASE_USER: postgres
      DATABASE_SCHEMA: stakeholders_db

    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      - database

  database:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: stakeholders_db
    volumes:
      - type: volume
        source: database-data
        target: /var/lib/postgresql/data
    ports:
      - "5433:5432"
 
  blog:
    build:
      context: ./Blog/blog-be
      dockerfile: Blog.API/Dockerfile
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_URLS: https://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/blog.pfx
      ConnectionStrings__MongoDb: "mongodb://mongo:mongo123@blog-mongo:27017/blog_db?authSource=admin"
      Nats__Url: nats://nats:4222
      Nats__TourPublishCommandSubject: tour.publish.command
      Nats__TourPublishReplySubject: tour.publish.reply
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro    
    depends_on:
      - blog-mongo
      - nats

  blog-mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: blog_db
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo123
    volumes:
      - blog-mongo-data:/data/db
  
  followers:
    build:
      context: ./Followers/followers-be
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      NEO4J_URI: neo4j://neo4j-followers:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      - neo4j-followers

  neo4j-followers:
    image: neo4j:5
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-followers-data:/data

  tours-database:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tours_db
    volumes:
      - tours-database-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  tours:
    build:
      context: ./Tours
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tours-database:5432/tours_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8083
      NATS_URL: nats://nats:4222
      NATS_TOUR_PUBLISH_COMMAND_SUBJECT: tour.publish.command
      NATS_TOUR_PUBLISH_REPLY_SUBJECT: tour.publish.reply
    depends_on:
      - tours-database
      - nats

  nats:
    image: nats
    restart: on-failure
    ports:
      - "4222:4222"

  gateway:
    build:
      context: ./Gateway/Gateway.API
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - stakeholders
      - blog

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - database
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  mongo-express:
    image: mongo-express:1
    restart: always
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: blog-mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo123
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_BASICAUTH: "true"
    depends_on:
      - blog-mongo
  
  purchase-database:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: purchase_db
    volumes:
      - purchase-database-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  purchase:
    build:
      context: ./Purchase
      dockerfile: Purchase.API/Dockerfile
      target: final
    restart: on-failure
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=purchase-database;Port=5432;Database=purchase_db;Username=postgres;Password=postgres"
      Services__Tours: "http://tours:8083"
      Jwt__Key: "L1uKpZQzI1Yx0+OaS0kXkE7u0n/5Q0U3R5s3FVmXcXU="
    depends_on:
      - purchase-database
      - tours

volumes:
  database-data:
  blog-mongo-data:
  pgadmin-data:
  neo4j-followers-data:
  tours-database-data:
  purchase-database-data:
