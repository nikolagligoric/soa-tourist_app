syntax = "proto3";

option csharp_namespace = "UsersRpc";

package users;

service UsersRpcService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);

  rpc GetProfile (GetProfileRequest) returns (ProfileResponse);
  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);
}

message RegisterRequest {
  string firstName = 1;
  string lastName = 2;
  string userName = 3;
  string password = 4;
  string email = 5;
  string role = 6;
}

message RegisterResponse {
  int32 id = 1;
  string firstName = 2;
  string lastName = 3;
  string userName = 4;
  string email = 5;
  string role = 6;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message GetProfileRequest {
  string username = 1;
}

message ProfileResponse {
  string firstName = 1;
  string lastName = 2;
  string profileImageUrl = 3;
  string bio = 4;
  string motto = 5;
}

message UpdateProfileRequest {
  string username = 1;
  string firstName = 2;
  string lastName = 3;
  string profileImageUrl = 4;
  string bio = 5;
  string motto = 6;
}

message UpdateProfileResponse {
  string message = 1;
}