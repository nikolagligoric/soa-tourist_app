syntax = "proto3";

option csharp_namespace = "PurchaseRpc";
option java_multiple_files = true;
option java_package = "com.soa.toursservice.grpc.purchase";
option java_outer_classname = "PurchaseProto";

package purchase;

service PurchaseRpcService {
  rpc HasPurchasedTour (HasPurchasedTourRequest) returns (HasPurchasedTourResponse);
}

message HasPurchasedTourRequest {
  string username = 1;
  int64 tourId = 2;
}

message HasPurchasedTourResponse {
  bool hasPurchased = 1;
}