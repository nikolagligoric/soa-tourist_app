<div class="home-container">
  <div class="main-content">
    <div class="welcome-section">
      <h1>Dobrodošli nazad, {{ currentUser?.username }}</h1>
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card admin-card" *ngIf="currentUser?.role === 'Administrator' || currentUser?.role === 'Admin'">
        <h3>🔧 Administratorski panel</h3>
        <p>Upravljajte nalozima, pregledajte bezbednost i vršite blokade korisnika.</p>
        <button class="action-btn danger-btn" routerLink="/admin/users">Upravljaj korisnicima</button>
      </div>
      <div class="dashboard-card tourist-card" *ngIf="currentUser?.role !== 'Administrator' && currentUser?.role !== 'Admin'">
        <h3>👋 Zdravo!</h3>
        <p>Koristi pretragu u gornjem meniju da pronađeš vodiče, saputnike ili nove rute.</p>
      </div>
    </div>
  </div>
  <div class="sidebar-recommendations" *ngIf="currentUser?.role !== 'Admin' && currentUser?.role !== 'Administrator'">
    <h3>Predlozi za tebe</h3>
    <div *ngIf="recommendedUsers && recommendedUsers.length === 0" class="no-rec-msg">Nema novih predloga.</div>
    <ul class="rec-list" *ngIf="recommendedUsers && recommendedUsers.length > 0">
      <li *ngFor="let username of recommendedUsers" class="rec-item">
        <div class="rec-user-info" [routerLink]="['/profile', username]">
          <span class="rec-avatar">👤</span>
          <span class="rec-username">{{ username }}</span>
        </div>
        <button class="rec-follow-btn" (click)="followFromHome(username)">Zaprati</button>
      </li>
    </ul>
  </div>
</div>
