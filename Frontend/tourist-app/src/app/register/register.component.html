<div class="register-page">

  <section class="register-visual">

    <div class="visual-content">

      <div class="brand">

        <div class="brand-icon">
          T
        </div>

        <span>
          TourApp
        </span>

      </div>


      <div class="visual-copy">

        <span class="eyebrow">
          Novi nalog
        </span>

        <h1>
          Kreiraj svoj TourApp nalog.
        </h1>

        <p>
          Registruj se kao turista ili vodič i koristi funkcionalnosti koje odgovaraju tvojoj ulozi.
        </p>

      </div>

    </div>

  </section>


  <section class="register-form-section">

    <div class="register-card">

      <div class="card-header">

        <span class="section-eyebrow">
          Registracija
        </span>

        <h2>
          Kreiraj nalog
        </h2>

        <p>
          Unesi osnovne podatke i izaberi svoju ulogu.
        </p>

      </div>


      <form (ngSubmit)="onRegister()">

        <div class="form-row">

          <div class="form-group">

            <label for="firstName">
              Ime
            </label>

            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="registerData.firstName"
              class="form-control"
              placeholder="Unesite ime"
              required>

          </div>


          <div class="form-group">

            <label for="lastName">
              Prezime
            </label>

            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="registerData.lastName"
              class="form-control"
              placeholder="Unesite prezime"
              required>

          </div>

        </div>


        <div class="form-group">

          <label for="userName">
            Korisničko ime
          </label>

          <input
            type="text"
            id="userName"
            name="userName"
            [(ngModel)]="registerData.userName"
            class="form-control"
            placeholder="Izaberite korisničko ime"
            required>

        </div>


        <div class="form-group">

          <label for="email">
            Email adresa
          </label>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="registerData.email"
            class="form-control"
            placeholder="ime@primer.com"
            required>

        </div>


        <div class="form-group">

          <label for="password">
            Lozinka
          </label>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="registerData.password"
            class="form-control"
            placeholder="Unesite lozinku"
            required>

        </div>


        <div class="form-group">

          <label for="role">
            Registrujem se kao
          </label>

          <select
            id="role"
            name="role"
            [(ngModel)]="registerData.role"
            class="form-control select-control"
            required>

            <option [value]="'Tourist'">
              Turista
            </option>

            <option [value]="'Guide'">
              Vodič
            </option>

          </select>

        </div>


        <div
          *ngIf="successMessage"
          class="alert alert-success">

          {{ successMessage }}

        </div>


        <div
          *ngIf="errorMessage"
          class="alert alert-danger">

          {{ errorMessage }}

        </div>


        <button
          type="submit"
          class="submit-btn">

          Registruj se

        </button>

      </form>


      <div class="register-footer">

        <span>
          Već imaš nalog?
        </span>

        <a routerLink="/login">
          Prijavi se
        </a>

      </div>

    </div>

  </section>

</div>
