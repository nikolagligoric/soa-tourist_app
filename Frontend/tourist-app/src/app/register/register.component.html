<div class="register-wrapper">
  <div class="register-card">
    <h2>📝 Kreirajte nalog</h2>

    <form (ngSubmit)="onRegister()">
      
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="firstName">Ime:</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="registerData.firstName" class="form-control" required>
        </div>

        <div class="form-group flex-1">
          <label for="lastName">Prezime:</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="registerData.lastName" class="form-control" required>
        </div>
      </div>

      <div class="form-group">
        <label for="userName">Korisničko ime:</label>
        <input type="text" id="userName" name="userName" [(ngModel)]="registerData.userName" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="email">Email adresa:</label>
        <input type="email" id="email" name="email" [(ngModel)]="registerData.email" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="password">Lozinka:</label>
        <input type="password" id="password" name="password" [(ngModel)]="registerData.password" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="role">Registrujem se kao:</label>
        <select id="role" name="role" [(ngModel)]="registerData.role" class="form-control select-control" required>
          <option [value]="'Tourist'">Turista</option>
          <option [value]="'Guide'">Vodič</option>
        </select>
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        ✅ {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="submit-btn">Registruj se</button>
    </form>

    <div class="register-footer">
      <p>Već imate nalog? <a routerLink="/login">Prijavite se ovde</a></p>
    </div>
  </div>
</div>
